name: Validate owner map edits

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test the public-data validator
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Validate both complete snapshots and independent revisions
        env:
          EVENT_NAME: ${{ github.event_name }}
          PREVIOUS_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          for feed in roads bumps; do
            filename=map.geojson
            if [[ "$feed" == bumps ]]; then filename=bumps.geojson; fi
            current_file="edits/$filename"
            if [[ "$EVENT_NAME" != "workflow_dispatch" && "$PREVIOUS_SHA" =~ ^[0-9a-f]{40}$ && "$PREVIOUS_SHA" != "0000000000000000000000000000000000000000" ]] && git cat-file -e "$PREVIOUS_SHA:$current_file" 2>/dev/null; then
              previous_file="$RUNNER_TEMP/previous-owner-$filename"
              git show "$PREVIOUS_SHA:$current_file" > "$previous_file"
              python3 tools/validate_map_edits.py "$current_file" --feed "$feed" --previous "$previous_file"
            else
              python3 tools/validate_map_edits.py "$current_file" --feed "$feed"
            fi
          done
      - name: Validate national source signs
        env:
          PREVIOUS_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          file=hazards/road-hazards.geojson
          if [[ "$PREVIOUS_SHA" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$PREVIOUS_SHA:$file" 2>/dev/null; then
            git show "$PREVIOUS_SHA:$file" > "$RUNNER_TEMP/previous-hazards.json"
            python3 tools/validate_hazards.py "$file" --previous "$RUNNER_TEMP/previous-hazards.json"
          else
            python3 tools/validate_hazards.py "$file"
          fi
