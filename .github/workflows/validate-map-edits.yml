name: Validate owner map edits

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test the public-data validator
        run: python3 -m unittest discover -s tools -p 'test_validate_map_edits.py'
      - name: Validate complete snapshot and revision
        env:
          EVENT_NAME: ${{ github.event_name }}
          PREVIOUS_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "workflow_dispatch" && "$PREVIOUS_SHA" =~ ^[0-9a-f]{40}$ && "$PREVIOUS_SHA" != "0000000000000000000000000000000000000000" ]] && git cat-file -e "$PREVIOUS_SHA:edits/map.geojson" 2>/dev/null; then
            previous_file="$RUNNER_TEMP/previous-owner-map.geojson"
            git show "$PREVIOUS_SHA:edits/map.geojson" > "$previous_file"
            python3 tools/validate_map_edits.py edits/map.geojson --previous "$previous_file"
          else
            python3 tools/validate_map_edits.py edits/map.geojson
          fi
